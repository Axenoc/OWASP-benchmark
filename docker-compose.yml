version: '3.8'

services:
  owasp-benchmark:
    build:
      context: .
      dockerfile: VMs/Dockerfile
    container_name: owasp-benchmark-app
    ports:
      - "8443:8443"
      - "8080:8080"
    volumes:
      - .:/owasp/BenchmarkJava
    networks:
      custom_net:
        ipv4_address: 172.28.0.50
    command: /bin/bash -c "./runRemoteAccessibleBenchmark.sh"

networks:
  custom_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
