<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<script src="/benchmark/js/jquery.min.js" type="text/javascript"></script>
<script src="/benchmark/js/testsuiteutils.js" type="text/javascript"></script>
<link rel="icon" type="image/png" href="/benchmark/favicon.ico">
<title>BenchmarkTestCWE620_04</title>
</head>
<body>
<h2>Verified Password Change</h2>
<form action="/benchmark/cwe-620/BenchmarkTestCWE620_04" method="POST" id="FormBenchmarkTestCWE620_04">
    <label>Account: <input type="email" name="account" value="victim@example.com"></label><br>
    <label>Current password: <input type="password" name="currentPassword" value="OriginalPassword123!"></label><br>
    <label>MFA code: <input type="text" name="mfaCode" value="246810" maxlength="6"></label><br>
    <label>New password: <input type="password" name="newPassword" value="NewVerifiedPassword1!"></label><br>
    <input type="button" id="change-btn" value="Change password">
</form>
<pre id="result"></pre>
<script>
$("#change-btn").on("click", function() {
    $.ajax({url: $("#FormBenchmarkTestCWE620_04").attr("action"), type: "POST",
        data: $("#FormBenchmarkTestCWE620_04").serialize(), complete: showResult});
});
function showResult(xhr) { $("#result").text("HTTP " + xhr.status + "\n" + xhr.responseText); }
</script>
</body>
</html>
