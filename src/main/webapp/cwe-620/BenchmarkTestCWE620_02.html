<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<script src="/benchmark/js/jquery.min.js" type="text/javascript"></script>
<script src="/benchmark/js/testsuiteutils.js" type="text/javascript"></script>
<link rel="icon" type="image/png" href="/benchmark/favicon.ico">
<title>BenchmarkTestCWE620_02</title>
</head>
<body>
<h2>Change Password</h2>
<form action="/benchmark/cwe-620/BenchmarkTestCWE620_02" method="POST" id="FormBenchmarkTestCWE620_02">
    <label>Account: <input type="email" name="account" value="victim@example.com"></label><br>
    <label>New password: <input type="password" name="newPassword" value="AttackerChosen123!"></label>
    <p>The frontend sends an MFA status header with the request.</p>
    <input type="button" id="change-btn" data-mfa-status="unverified" value="Change password">
</form>
<pre id="result"></pre>
<script>
$("#change-btn").on("click", function() {
    $.ajax({url: $("#FormBenchmarkTestCWE620_02").attr("action"), type: "POST",
        headers: {"X-MFA-Verified": $(this).attr("data-mfa-status")},
        data: $("#FormBenchmarkTestCWE620_02").serialize(), complete: showResult});
});
function showResult(xhr) { $("#result").text("HTTP " + xhr.status + "\n" + xhr.responseText); }
</script>
</body>
</html>
