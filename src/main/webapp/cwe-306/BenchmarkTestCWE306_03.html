<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<script src="/benchmark/js/jquery.min.js" type="text/javascript"></script>
<script type="text/javascript" src="/benchmark/js/js.cookie.js"></script>
<script src="/benchmark/js/testsuiteutils.js" type="text/javascript"></script>
<link rel="icon" type="image/png" href="/benchmark/favicon.ico">
<title>BenchmarkTestCWE306_03</title>
</head>
<body>
    <form action="/benchmark/cwe-306/BenchmarkTestCWE306_03" method="POST"
            id="FormBenchmarkTestCWE306_03" autocomplete="off">
        <div>
            <label>Username: </label>
            <input type="text" id="BenchmarkTestCWE306_03_user"
                    name="BenchmarkTestCWE306_03_user" value="guest"><br>
            <label>Password: </label>
            <input type="password" id="BenchmarkTestCWE306_03_pass"
                    name="BenchmarkTestCWE306_03_pass" value="guest123">
        </div>
        <br>
        <div>
            <input type="button" id="login-btn" value="Login">
        </div>
    </form>

    <script>
    $("#login-btn").on("click", function() {
        Cookies.set("ATD-Admin", "true", {path: "/benchmark/cwe-306"});
        $.ajax({
            url: $("#FormBenchmarkTestCWE306_03").attr("action"),
            type: "POST",
            data: $("#FormBenchmarkTestCWE306_03").serialize(),
            success: function(data) {
                document.open(); document.write(data); document.close();
            },
            complete: function() {
                Cookies.remove("ATD-Admin", {path: "/benchmark/cwe-306"});
            }
        });
    });
    </script>
</body>
</html>
