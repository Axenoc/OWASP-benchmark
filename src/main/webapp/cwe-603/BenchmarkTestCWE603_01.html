<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<script src="/benchmark/js/jquery.min.js" type="text/javascript"></script>
<script src="/benchmark/js/testsuiteutils.js" type="text/javascript"></script>
<link rel="icon" type="image/png" href="/benchmark/favicon.ico">
<title>BenchmarkTestCWE603_01</title>
</head>
<body>
<h2>Account Login</h2>
<form action="/benchmark/cwe-603/BenchmarkTestCWE603_01" method="POST" id="FormBenchmarkTestCWE603_01">
    <label>Username: <input type="text" id="username" value="admin"></label><br>
    <label>Password: <input type="password" id="password" value="WrongPassword"></label>
    <input type="hidden" id="client-authenticated" name="clientAuthenticated" value="false">
    <input type="button" id="login-btn" value="Login">
</form>
<pre id="result"></pre>
<script>
$("#login-btn").on("click", function() {
    if ($("#username").val() === "admin" && $("#password").val() === "ClientOnly123!") {
        $("#client-authenticated").val("true");
    }
    $.ajax({url: $("#FormBenchmarkTestCWE603_01").attr("action"), type: "POST",
        data: $("#FormBenchmarkTestCWE603_01").serialize(), complete: showResult});
});
function showResult(xhr) { $("#result").text("HTTP " + xhr.status + "\n" + xhr.responseText); }
</script>
</body>
</html>
