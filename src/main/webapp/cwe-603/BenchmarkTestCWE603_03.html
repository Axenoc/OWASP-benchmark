<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<script src="/benchmark/js/jquery.min.js" type="text/javascript"></script>
<script src="/benchmark/js/js.cookie.js" type="text/javascript"></script>
<script src="/benchmark/js/testsuiteutils.js" type="text/javascript"></script>
<link rel="icon" type="image/png" href="/benchmark/favicon.ico">
<title>BenchmarkTestCWE603_03</title>
</head>
<body>
<h2>Support Login</h2>
<form action="/benchmark/cwe-603/BenchmarkTestCWE603_03" method="POST" id="FormBenchmarkTestCWE603_03">
    <label>Username: <input type="text" id="username" value="support-admin"></label><br>
    <label>PIN: <input type="password" id="pin" value="000000"></label>
    <input type="button" id="login-btn" value="Login">
</form>
<pre id="result"></pre>
<script>
$("#login-btn").on("click", function() {
    var state = $("#username").val() === "support-admin" && $("#pin").val() === "739251"
            ? "authenticated" : "denied";
    Cookies.set("CWE603-ClientAuth", state, {path: "/benchmark/cwe-603"});
    $.ajax({url: $("#FormBenchmarkTestCWE603_03").attr("action"), type: "POST", complete: function(xhr) {
        Cookies.remove("CWE603-ClientAuth", {path: "/benchmark/cwe-603"});
        $("#result").text("HTTP " + xhr.status + "\n" + xhr.responseText);
    }});
});
</script>
</body>
</html>
