<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<script src="/benchmark/js/jquery.min.js" type="text/javascript"></script>
<script src="/benchmark/js/testsuiteutils.js" type="text/javascript"></script>
<link rel="icon" type="image/png" href="/benchmark/favicon.ico">
<title>BenchmarkTestCWE603_02</title>
</head>
<body>
<h2>Billing Login</h2>
<form action="/benchmark/cwe-603/BenchmarkTestCWE603_02" method="POST" id="FormBenchmarkTestCWE603_02">
    <label>Username: <input type="text" id="username" value="billing-admin"></label><br>
    <label>Password: <input type="password" id="password" value="WrongPassword"></label>
    <input type="button" id="login-btn" value="Login">
</form>
<pre id="result"></pre>
<script>
$("#login-btn").on("click", function() {
    var result = $("#username").val() === "billing-admin"
            && $("#password").val() === "BillingClient456!" ? "yes" : "no";
    $.ajax({url: $("#FormBenchmarkTestCWE603_02").attr("action"), type: "POST",
        headers: {"X-Client-Authenticated": result}, complete: showResult});
});
function showResult(xhr) { $("#result").text("HTTP " + xhr.status + "\n" + xhr.responseText); }
</script>
</body>
</html>
