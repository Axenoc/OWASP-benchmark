<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<script src="/benchmark/js/jquery.min.js" type="text/javascript"></script>
<script type="text/javascript" src="/benchmark/js/js.cookie.js"></script>
<script src="/benchmark/js/testsuiteutils.js" type="text/javascript"></script>
<link rel="icon" type="image/png" href="/benchmark/favicon.ico">
<title>BenchmarkTestCWE645_05</title>
</head>
<body>
    <form action="/benchmark/cwe-645/BenchmarkTestCWE645_05" method="POST"
            id="FormBenchmarkTestCWE645_05" autocomplete="off">
        <div>
            <label>Username: </label>
            <input type="text" id="BenchmarkTestCWE645_05_user" value="victim@example.com"><br>
            <label>Password: </label>
            <input type="password" id="BenchmarkTestCWE645_05_pass" value="WrongPassword">
        </div>
        <p>Failures temporarily throttle this network client, not the victim account.</p>
        <div><input type="button" id="login-btn" value="Login"></div>
    </form>
    <pre id="result"></pre>

    <script>
    $("#login-btn").on("click", function() {
        $.ajax({
            url: $("#FormBenchmarkTestCWE645_05").attr("action"),
            type: "POST",
            headers: {
                "X-Benchmark-Username": $("#BenchmarkTestCWE645_05_user").val(),
                "X-Benchmark-Password": $("#BenchmarkTestCWE645_05_pass").val()
            },
            complete: function(xhr) {
                $("#result").text("HTTP " + xhr.status + "\n" + xhr.responseText);
            }
        });
    });
    </script>
</body>
</html>
